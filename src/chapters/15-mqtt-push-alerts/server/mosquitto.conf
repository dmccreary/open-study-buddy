# /etc/mosquitto/conf.d/study-buddy.conf   (Chapter 15)
#
# Mosquitto settings for a school Raspberry Pi. Copy this file there, edit the
# address on the "listener" line, and restart:  sudo systemctl restart mosquitto
#
# The package's main file (/etc/mosquitto/mosquitto.conf) already sets
# persistence and logging and includes every file in conf.d/, so those
# settings are not repeated here. Check yours with:
#     grep -v '^#' /etc/mosquitto/mosquitto.conf

# 1. Listen on the Pi's LAN address only, never on every interface.
#    Give the Pi a fixed address (a DHCP reservation on the router), because
#    Mosquitto will not start if this address does not exist.
listener 1883 192.168.1.50

# 2. No anonymous connections. Every client needs a user name and password.
allow_anonymous false
password_file /etc/mosquitto/study-buddy.passwd

# 3. Who may publish and subscribe to what (see study-buddy.acl).
acl_file /etc/mosquitto/study-buddy.acl

# 4. The Pico reads a whole message into RAM before it can look at it, so the
#    broker refuses to forward anything larger than an alert can be.
#    (alerts.py allows 512 bytes; this leaves room for a little growth.)
message_size_limit 1024
