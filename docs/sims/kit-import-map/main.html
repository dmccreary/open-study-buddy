<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Kit Import Map</title>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="graph-area">
            <div id="network"></div>

            <!-- Title at top center of the graph -->
            <div class="title">Kit Import Map</div>

            <!-- Legend in upper left -->
            <div class="legend">
                <div class="legend-item"><div class="legend-swatch swatch-top"></div><span>Pico top level ( / )</span></div>
                <div class="legend-item"><div class="legend-swatch swatch-lib"></div><span>Pico <code>/lib</code> folder</span></div>
                <div class="legend-item"><div class="legend-arrow">&rarr;</div><span>imports</span></div>
            </div>
        </div>

        <!-- Right panel: file details and the import check -->
        <div class="right-panel">
            <div class="info-panel">
                <div class="info-title" id="info-title">File details</div>
                <div class="info-content" id="info-content">
                    <p class="info-placeholder">Click any file in the graph to see its Pico folder and what it does.</p>
                </div>
            </div>

            <div class="check-panel">
                <div class="check-header">
                    <span class="check-title">Import check</span>
                    <span class="score" id="score"></span>
                </div>
                <div class="question" id="question">Which files does 04-hello-world.py need?</div>
                <div class="hint" id="hint">Read the arrows, then press Start check. You will pick the kit files that each of 5 files imports.</div>
                <div class="choices" id="choices"></div>
                <div class="buttons">
                    <button class="btn btn-primary" id="action-btn">Start check</button>
                </div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>
    </div>

    <script src="kit-import-map.js"></script>
</body>
</html>
