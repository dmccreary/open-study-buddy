<svg viewBox="0 0 1300 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Open Study Buddy wiring diagram with breadboard row numbers</title>
  <desc>Block diagram of the Open Study Buddy kit with breadboard row numbers added to the Pico's left-edge pins. Rows 3, 8, 13 and 18 are GND. All power wires share one 3.3V pin on the right (row 5). The I2S word-select pins (LRC, WS) are placed one row after their bit-clock pins (BCLK, SCK).</desc>

  <rect x="0" y="0" width="1300" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="650" y="25" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Open Study Buddy &#8212; Wiring Diagram</text>
  <text x="650" y="42" text-anchor="middle" font-size="12" fill="#666">Breadboard row numbers on the Pico's left edge &#8212; rows ending in 3 or 8 are GND &#8226; row numbers &#8800; GPIO numbers</text>

  <!-- ============ DISPLAY block ============ -->
  <rect x="40" y="70" width="270" height="300" rx="12" fill="#f7f7f9" stroke="#333" stroke-width="2"/>
  <text x="175" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#111">GC9B72 Round Display</text>
  <line x1="55" y1="103" x2="295" y2="103" stroke="#ccc"/>

  <text x="302" y="129" text-anchor="end" font-size="12" font-weight="600" fill="#111111">GND</text>
  <circle cx="310" cy="125" r="4" fill="#111111"/>
  <text x="302" y="157" text-anchor="end" font-size="12" font-weight="600" fill="#c21f1f">VCC</text>
  <circle cx="310" cy="153" r="4" fill="#e02b2b"/>
  <text x="302" y="185" text-anchor="end" font-size="12" font-weight="600" fill="#b35e00">CLK</text>
  <circle cx="310" cy="181" r="4" fill="#f28c28"/>
  <text x="302" y="213" text-anchor="end" font-size="12" font-weight="600" fill="#8a6d00">SDA</text>
  <circle cx="310" cy="209" r="4" fill="#f2c200"/>
  <text x="302" y="241" text-anchor="end" font-size="12" font-weight="600" fill="#1f7a35">RST</text>
  <circle cx="310" cy="237" r="4" fill="#2e9e46"/>
  <text x="302" y="269" text-anchor="end" font-size="12" font-weight="600" fill="#1f4fa0">DC</text>
  <circle cx="310" cy="265" r="4" fill="#2f6fd1"/>
  <text x="302" y="297" text-anchor="end" font-size="12" font-weight="600" fill="#6c2e86">CS</text>
  <circle cx="310" cy="293" r="4" fill="#8e44ad"/>
  <text x="302" y="325" text-anchor="end" font-size="12" font-weight="600" fill="#6b6b6b">BL</text>
  <circle cx="310" cy="321" r="4" fill="#9b9b9b"/>
  <text x="302" y="353" text-anchor="end" font-size="12" font-weight="600" fill="#555">SDO</text>
  <circle cx="310" cy="349" r="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="318" y="345" font-size="10" font-style="italic" fill="#777">(white wire)</text>

  <!-- display signal/ground wires to Pico rows -->
  <line x1="310" y1="125" x2="700" y2="159" stroke="#111111" stroke-width="3"/>
  <line x1="310" y1="181" x2="700" y2="191" stroke="#f28c28" stroke-width="3"/>
  <line x1="310" y1="209" x2="700" y2="223" stroke="#f2c200" stroke-width="3"/>
  <line x1="310" y1="237" x2="700" y2="255" stroke="#2e9e46" stroke-width="3"/>
  <line x1="310" y1="265" x2="700" y2="287" stroke="#2f6fd1" stroke-width="3"/>
  <line x1="310" y1="293" x2="700" y2="351" stroke="#8e44ad" stroke-width="3"/>
  <line x1="310" y1="321" x2="700" y2="383" stroke="#9b9b9b" stroke-width="3"/>
  <line x1="310" y1="349" x2="700" y2="415" stroke="#999999" stroke-width="5"/>
  <line x1="310" y1="349" x2="700" y2="415" stroke="#ffffff" stroke-width="2.5"/>

  <!-- ============ AMPLIFIER block ============ -->
  <rect x="40" y="380" width="270" height="244" rx="12" fill="#f7f7f9" stroke="#333" stroke-width="2"/>
  <text x="175" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#111">MAX98357A Amplifier</text>
  <line x1="55" y1="408" x2="295" y2="408" stroke="#ccc"/>

  <text x="302" y="432" text-anchor="end" font-size="12" font-weight="600" fill="#8a6d00">LRC</text>
  <circle cx="310" cy="428" r="4" fill="#f2c200"/>
  <text x="302" y="460" text-anchor="end" font-size="12" font-weight="600" fill="#1f7a35">BCLK</text>
  <circle cx="310" cy="456" r="4" fill="#2e9e46"/>
  <text x="302" y="488" text-anchor="end" font-size="12" font-weight="600" fill="#1f4fa0">DIN</text>
  <circle cx="310" cy="484" r="4" fill="#2f6fd1"/>
  <text x="302" y="516" text-anchor="end" font-size="12" font-weight="600" fill="#6c2e86">GAIN</text>
  <circle cx="310" cy="512" r="4" fill="#8e44ad"/>
  <text x="302" y="544" text-anchor="end" font-size="12" font-weight="600" fill="#777">SD</text>
  <circle cx="310" cy="540" r="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <line x1="310" y1="540" x2="360" y2="540" stroke="#bbbbbb" stroke-width="3" stroke-dasharray="6,5"/>
  <circle cx="360" cy="540" r="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="368" y="544" font-size="11" font-style="italic" fill="#777">not connected</text>
  <text x="302" y="572" text-anchor="end" font-size="12" font-weight="600" fill="#111111">GND</text>
  <circle cx="310" cy="568" r="4" fill="#111111"/>
  <text x="302" y="600" text-anchor="end" font-size="12" font-weight="600" fill="#c21f1f">VIN</text>
  <circle cx="310" cy="596" r="4" fill="#e02b2b"/>

  <line x1="310" y1="428" x2="700" y2="511" stroke="#f2c200" stroke-width="3"/>
  <line x1="310" y1="456" x2="700" y2="447" stroke="#2e9e46" stroke-width="3"/>
  <line x1="310" y1="484" x2="700" y2="543" stroke="#2f6fd1" stroke-width="3"/>
  <line x1="310" y1="512" x2="700" y2="575" stroke="#8e44ad" stroke-width="3"/>
  <line x1="310" y1="568" x2="700" y2="479" stroke="#111111" stroke-width="3"/>

  <rect x="80" y="484" width="190" height="36" rx="6" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="175" y="500" text-anchor="middle" font-size="10" font-weight="600" fill="#1f7a35">I2S rule: LRC = BCLK + 1</text>
  <text x="175" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="#1f7a35">GP10 = GP9 + 1 &#10003; (R14, R12)</text>

  <!-- ============ MICROPHONE block ============ -->
  <rect x="40" y="634" width="270" height="190" rx="12" fill="#f7f7f9" stroke="#333" stroke-width="2"/>
  <text x="175" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#111">INMP441 Microphone</text>
  <line x1="55" y1="664" x2="295" y2="664" stroke="#ccc"/>

  <text x="302" y="688" text-anchor="end" font-size="12" font-weight="600" fill="#c21f1f">VCC</text>
  <circle cx="310" cy="684" r="4" fill="#e02b2b"/>
  <text x="302" y="716" text-anchor="end" font-size="12" font-weight="600" fill="#1f7a35">SD</text>
  <circle cx="310" cy="712" r="4" fill="#2e9e46"/>
  <text x="302" y="744" text-anchor="end" font-size="12" font-weight="600" fill="#111111">GND / L-R</text>
  <circle cx="310" cy="740" r="4" fill="#111111"/>
  <text x="302" y="772" text-anchor="end" font-size="12" font-weight="600" fill="#b35e00">SCK</text>
  <circle cx="310" cy="768" r="4" fill="#f28c28"/>
  <text x="302" y="800" text-anchor="end" font-size="12" font-weight="600" fill="#8a6d00">WS</text>
  <circle cx="310" cy="796" r="4" fill="#f2c200"/>

  <line x1="310" y1="712" x2="700" y2="607" stroke="#2e9e46" stroke-width="3"/>
  <line x1="310" y1="740" x2="700" y2="639" stroke="#111111" stroke-width="3"/>
  <line x1="310" y1="768" x2="700" y2="671" stroke="#f28c28" stroke-width="3"/>
  <line x1="310" y1="796" x2="700" y2="703" stroke="#f2c200" stroke-width="3"/>

  <rect x="80" y="711" width="190" height="36" rx="6" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="175" y="727" text-anchor="middle" font-size="10" font-weight="600" fill="#1f7a35">I2S rule: WS = SCK + 1</text>
  <text x="175" y="743" text-anchor="middle" font-size="10" font-weight="600" fill="#1f7a35">row 20 = row 19 + 1 &#10003;</text>

  <!-- ============ shared 3V3 power bus ============ -->
  <line x1="310" y1="153" x2="660" y2="153" stroke="#e02b2b" stroke-width="3"/>
  <line x1="310" y1="596" x2="660" y2="596" stroke="#e02b2b" stroke-width="3"/>
  <line x1="310" y1="684" x2="660" y2="684" stroke="#e02b2b" stroke-width="3"/>
  <line x1="660" y1="153" x2="660" y2="684" stroke="#e02b2b" stroke-width="3"/>
  <circle cx="660" cy="153" r="4" fill="#e02b2b"/>
  <circle cx="660" cy="596" r="4" fill="#e02b2b"/>
  <circle cx="660" cy="684" r="4" fill="#e02b2b"/>
  <polyline points="660,153 660,35 980,35 980,223 940,223" fill="none" stroke="#e02b2b" stroke-width="3"/>
  <text x="665" y="146" font-size="10" font-style="italic" fill="#c21f1f">all VCC / VIN wires</text>
  <text x="665" y="158" font-size="10" font-style="italic" fill="#c21f1f">share one 3.3V pin</text>

  <!-- ============ PICO 2 W block ============ -->
  <rect x="700" y="55" width="240" height="685" rx="12" fill="#eef3fb" stroke="#333" stroke-width="2"/>
  <text x="820" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Raspberry Pi Pico 2 W</text>
  <line x1="715" y1="90" x2="925" y2="90" stroke="#aac"/>

  <!-- left-edge: breadboard row number OUTSIDE the Pico, logical GPIO/GND name INSIDE -->
  <!-- row 1 -->
  <circle cx="700" cy="95" r="3.5" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>
  <text x="690" y="99" text-anchor="end" font-size="10" fill="#999">R1</text>
  <text x="708" y="99" font-size="10" fill="#555">GP0</text>
  <!-- row 2 -->
  <circle cx="700" cy="127" r="3.5" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>
  <text x="690" y="131" text-anchor="end" font-size="10" fill="#999">R2</text>
  <text x="708" y="131" font-size="10" fill="#555">GP1</text>
  <!-- row 3 GND -->
  <circle cx="700" cy="159" r="5" fill="#111111"/>
  <text x="690" y="163" text-anchor="end" font-size="10" fill="#999">R3</text>
  <text x="708" y="163" font-size="10" font-weight="700" fill="#111">GND</text>
  <!-- row 4 -->
  <circle cx="700" cy="191" r="4" fill="#f28c28"/>
  <text x="690" y="195" text-anchor="end" font-size="10" fill="#999">R4</text>
  <text x="708" y="195" font-size="10" fill="#555">GP2</text>
  <!-- row 5 -->
  <circle cx="700" cy="223" r="4" fill="#f2c200"/>
  <text x="690" y="227" text-anchor="end" font-size="10" fill="#999">R5</text>
  <text x="708" y="227" font-size="10" fill="#555">GP3</text>
  <!-- row 6 -->
  <circle cx="700" cy="255" r="4" fill="#2e9e46"/>
  <text x="690" y="259" text-anchor="end" font-size="10" fill="#999">R6</text>
  <text x="708" y="259" font-size="10" fill="#555">GP4</text>
  <!-- row 7 -->
  <circle cx="700" cy="287" r="4" fill="#2f6fd1"/>
  <text x="690" y="291" text-anchor="end" font-size="10" fill="#999">R7</text>
  <text x="708" y="291" font-size="10" fill="#555">GP5</text>
  <!-- row 8 GND (not wired, fact only) -->
  <circle cx="700" cy="319" r="5" fill="#111111"/>
  <text x="690" y="323" text-anchor="end" font-size="10" fill="#999">R8</text>
  <text x="708" y="323" font-size="10" font-weight="700" fill="#111">GND</text>
  <!-- row 9 -->
  <circle cx="700" cy="351" r="4" fill="#8e44ad"/>
  <text x="690" y="355" text-anchor="end" font-size="10" fill="#999">R9</text>
  <text x="708" y="355" font-size="10" fill="#555">GP6</text>
  <!-- row 10 -->
  <circle cx="700" cy="383" r="4" fill="#9b9b9b"/>
  <text x="690" y="387" text-anchor="end" font-size="10" fill="#999">R10</text>
  <text x="708" y="387" font-size="10" fill="#555">GP7</text>
  <!-- row 11: display SDO (white wire) -->
  <circle cx="700" cy="415" r="4.5" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="690" y="419" text-anchor="end" font-size="10" fill="#999">R11</text>
  <text x="708" y="419" font-size="10" fill="#555">GP8</text>
  <!-- row 12 -->
  <circle cx="700" cy="447" r="4" fill="#2e9e46"/>
  <text x="690" y="451" text-anchor="end" font-size="10" fill="#999">R12</text>
  <text x="708" y="451" font-size="10" fill="#555">GP9</text>
  <!-- row 13 GND -->
  <circle cx="700" cy="479" r="5" fill="#111111"/>
  <text x="690" y="483" text-anchor="end" font-size="10" fill="#999">R13</text>
  <text x="708" y="483" font-size="10" font-weight="700" fill="#111">GND</text>
  <!-- row 14 -->
  <circle cx="700" cy="511" r="4" fill="#f2c200"/>
  <text x="690" y="515" text-anchor="end" font-size="10" fill="#999">R14</text>
  <text x="708" y="515" font-size="10" fill="#555">GP10</text>
  <!-- row 15 -->
  <circle cx="700" cy="543" r="4" fill="#2f6fd1"/>
  <text x="690" y="547" text-anchor="end" font-size="10" fill="#999">R15</text>
  <text x="708" y="547" font-size="10" fill="#555">GP11</text>
  <!-- row 16 -->
  <circle cx="700" cy="575" r="4" fill="#8e44ad"/>
  <text x="690" y="579" text-anchor="end" font-size="10" fill="#999">R16</text>
  <text x="708" y="579" font-size="10" fill="#555">GP12</text>
  <!-- row 17 -->
  <circle cx="700" cy="607" r="4" fill="#2e9e46"/>
  <text x="690" y="611" text-anchor="end" font-size="10" fill="#999">R17</text>
  <text x="708" y="611" font-size="10" fill="#555">GP13</text>
  <!-- row 18 GND -->
  <circle cx="700" cy="639" r="5" fill="#111111"/>
  <text x="690" y="643" text-anchor="end" font-size="10" fill="#999">R18</text>
  <text x="708" y="643" font-size="10" font-weight="700" fill="#111">GND</text>
  <!-- row 19 -->
  <circle cx="700" cy="671" r="4" fill="#f28c28"/>
  <text x="690" y="675" text-anchor="end" font-size="10" fill="#999">R19</text>
  <text x="708" y="675" font-size="10" fill="#555">GP14</text>
  <!-- row 20 -->
  <circle cx="700" cy="703" r="4" fill="#f2c200"/>
  <text x="690" y="707" text-anchor="end" font-size="10" fill="#999">R20 (last)</text>
  <text x="708" y="707" font-size="10" fill="#555">GP15</text>

  <!-- right side: single shared 3V3 pin at row 5 -->
  <circle cx="940" cy="223" r="5" fill="#e02b2b"/>
  <text x="932" y="219" text-anchor="end" font-size="12" font-weight="700" fill="#c21f1f">3V3</text>
  <text x="948" y="227" font-size="10" fill="#999">row 5, right side</text>

  <!-- button pins exit the bottom of the Pico, labeled by GPIO (not row) -->
  <circle cx="740" cy="740" r="4" fill="#f2c200"/>
  <circle cx="800" cy="740" r="4" fill="#f28c28"/>
  <circle cx="860" cy="740" r="4" fill="#2e9e46"/>
  <circle cx="920" cy="740" r="4" fill="#111111"/>
  <text x="740" y="732" text-anchor="middle" font-size="11" font-weight="600" fill="#8a6d00">GP16</text>
  <text x="800" y="732" text-anchor="middle" font-size="11" font-weight="600" fill="#b35e00">GP17</text>
  <text x="860" y="732" text-anchor="middle" font-size="11" font-weight="600" fill="#1f7a35">GP18</text>
  <text x="920" y="732" text-anchor="middle" font-size="11" font-weight="600" fill="#111">GND</text>

  <line x1="740" y1="740" x2="740" y2="765" stroke="#f2c200" stroke-width="3"/>
  <line x1="800" y1="740" x2="800" y2="765" stroke="#f28c28" stroke-width="3"/>
  <line x1="860" y1="740" x2="860" y2="765" stroke="#2e9e46" stroke-width="3"/>
  <line x1="920" y1="740" x2="920" y2="765" stroke="#111111" stroke-width="3"/>

  <!-- ============ BUTTONS block ============ -->
  <rect x="700" y="765" width="240" height="170" rx="12" fill="#f7f7f9" stroke="#333" stroke-width="2"/>
  <text x="820" y="788" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Buttons</text>
  <line x1="715" y1="796" x2="925" y2="796" stroke="#ccc"/>

  <circle cx="740" cy="850" r="18" fill="#fff" stroke="#f2c200" stroke-width="3"/>
  <circle cx="800" cy="850" r="18" fill="#fff" stroke="#f28c28" stroke-width="3"/>
  <circle cx="860" cy="850" r="18" fill="#fff" stroke="#2e9e46" stroke-width="3"/>
  <text x="740" y="885" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6d00">MODE</text>
  <text x="800" y="885" text-anchor="middle" font-size="12" font-weight="600" fill="#b35e00">UP</text>
  <text x="860" y="885" text-anchor="middle" font-size="12" font-weight="600" fill="#1f7a35">DOWN</text>

  <line x1="920" y1="842" x2="920" y2="858" stroke="#111111" stroke-width="3"/>
  <line x1="906" y1="858" x2="934" y2="858" stroke="#111111" stroke-width="3"/>
  <line x1="911" y1="865" x2="929" y2="865" stroke="#111111" stroke-width="2"/>
  <line x1="915" y1="871" x2="925" y2="871" stroke="#111111" stroke-width="2"/>
  <text x="920" y="888" text-anchor="middle" font-size="11" fill="#111">other legs</text>

  <text x="820" y="915" text-anchor="middle" font-size="11" font-style="italic" fill="#777">Each button's other leg returns to GND; Pico's internal pull-ups read the GPIO.</text>
  <text x="820" y="930" text-anchor="middle" font-size="10" fill="#999">Buttons are labeled by GPIO number, not breadboard row.</text>

  <!-- ============ Notes panel ============ -->
  <rect x="1000" y="70" width="270" height="356" rx="10" fill="#fffceb" stroke="#d8c870" stroke-width="1.5"/>
  <text x="1020" y="94" font-size="13" font-weight="700" fill="#5c4d05">Notes</text>
  <text x="1020" y="118" font-size="11" fill="#444">&#8226; Row numbers (R1&#8211;R20, outside the</text>
  <text x="1028" y="132" font-size="11" fill="#444">Pico) mark breadboard position.</text>
  <text x="1028" y="146" font-size="11" fill="#444">GPIO/GND names (inside) are the</text>
  <text x="1028" y="160" font-size="11" fill="#444">Pico's real logical pin at that row.</text>
  <text x="1020" y="182" font-size="11" fill="#444">&#8226; Rows ending in 3 or 8 (3, 8, 13,</text>
  <text x="1028" y="196" font-size="11" fill="#444">18) are GND, marked with a</text>
  <text x="1028" y="210" font-size="11" fill="#444">black dot.</text>
  <text x="1020" y="232" font-size="11" fill="#444">&#8226; Every VCC / VIN wire (red)</text>
  <text x="1028" y="246" font-size="11" fill="#444">shares one 3.3V pin: row 5 on</text>
  <text x="1028" y="260" font-size="11" fill="#444">the right side.</text>
  <text x="1020" y="282" font-size="11" fill="#444">&#8226; Display GND uses row 3; amp</text>
  <text x="1028" y="296" font-size="11" fill="#444">GND uses row 13; mic GND</text>
  <text x="1028" y="310" font-size="11" fill="#444">(and L/R) uses row 18.</text>
  <text x="1020" y="332" font-size="11" fill="#444">&#8226; I2S rule: the word-select pin</text>
  <text x="1028" y="346" font-size="11" fill="#444">(LRC, WS) must be exactly one</text>
  <text x="1028" y="360" font-size="11" fill="#444">row after the bit-clock pin</text>
  <text x="1028" y="374" font-size="11" fill="#444">(BCLK, SCK) &#8212; checked above.</text>
  <text x="1020" y="396" font-size="11" fill="#444">&#8226; Display SDO now wires to R11</text>
  <text x="1028" y="410" font-size="11" fill="#444">(GP8); amp SD stays unconnected.</text>
</svg>
