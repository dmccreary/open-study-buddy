<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Study Buddy Architecture Explorer</title>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!-- graph area: overlays are siblings of #network, never children -->
        <div class="graph-area">
            <div id="network"></div>
            <div class="title">Study Buddy Architecture Explorer</div>
        </div>

        <!-- right panel: mode switch, explore info, quiz -->
        <div class="right-panel">
            <div class="mode-switch">
                <button class="btn mode-btn active" id="explore-btn">Explore</button>
                <button class="btn mode-btn" id="quiz-btn">Quiz</button>
            </div>

            <div id="explore-panel">
                <div class="panel-box check-box">
                    <div class="box-title">Check yourself</div>
                    <div>Which part must the Pico talk to over Wi-Fi?</div>
                    <button class="btn btn-small" id="reveal-btn">Show answer</button>
                    <div class="check-answer" id="check-answer"></div>
                </div>
                <div class="panel-box">
                    <div class="instruction" id="explore-instruction">Click a part to learn its job.</div>
                    <div class="part-name" id="part-name"></div>
                    <div class="part-group" id="part-group"></div>
                    <div class="part-job" id="part-job"></div>
                    <div class="connections" id="connections"></div>
                </div>
            </div>

            <div id="quiz-panel" class="hidden">
                <div class="panel-box">
                    <div class="quiz-header">
                        <span id="quiz-progress">Question 1 of 6</span>
                        <span id="quiz-score">Score: 0 of 6</span>
                    </div>
                    <div class="quiz-note">Job descriptions written for this sim</div>
                    <div class="quiz-job" id="quiz-job"></div>
                    <div class="instruction" id="quiz-instruction">Click the part that does this job.</div>
                    <div class="feedback" id="quiz-feedback"></div>
                    <div class="quiz-buttons">
                        <button class="btn btn-primary" id="next-btn" disabled>Next question</button>
                        <button class="btn btn-secondary" id="restart-btn">Restart quiz</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="study-buddy-architecture-explorer.js"></script>
</body>
</html>
