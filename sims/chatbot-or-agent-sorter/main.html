<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Chatbot or Agent Sorter MicroSim using P5.js 2.3.2</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        button {
            font-size: 15px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        button:disabled {
            opacity: 0.45;
            cursor: default;
        }
        button.chosen {
            outline: 3px solid royalblue;
            opacity: 1;
        }
        /* narrow screens: smaller buttons so the control row fits the canvas */
        @media (max-width: 480px) {
            button {
                font-size: 13px;
                padding: 4px 6px;
            }
        }
        @media (max-width: 380px) {
            button {
                font-size: 12px;
                padding: 4px 4px;
            }
        }
    </style>
    <script src="chatbot-or-agent-sorter.js"></script>
</head>
<body>
    <main></main>
    <br/>
    <a href=".">Back to the Chatbot or Agent Sorter Lesson Plan</a>
</body>
</html>
