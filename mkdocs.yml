# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Open Study Buddy'
site_description: 'An interactive intelligent textbook to support the low-cost Open Study Buddy personal agent hardware for students.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/open-study-buddy/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/open-study-buddy'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Personal Agents and the Open Study Buddy Architecture: chapters/01-personal-agents-architecture/index.md
      - 2. MicroPython Review for Embedded Systems: chapters/02-micropython-review/index.md
      - 3. Sound and Digital Audio Basics: chapters/03-sound-and-digital-audio/index.md
      - 4. The Pico Kit Hardware and Wiring: chapters/04-pico-kit-hardware/index.md
      - "5. Display Basics: Pixels, Color, and Frame Size": chapters/05-display-basics/index.md
      - 6. Drawing Directly to Display Regions: chapters/06-display-regions-and-drawing/index.md
      - 7. Buttons, State Machines, and Device Modes: chapters/07-buttons-and-device-modes/index.md
      - "8. I2S Audio: Recording and Playing Sound": chapters/08-i2s-audio/index.md
      - 9. Signal Processing and the FFT: chapters/09-signal-processing-fft/index.md
      - 10. High-Performance MicroPython: chapters/10-high-performance-micropython/index.md
      - 11. Microphone Calibration and Push-to-Talk: chapters/11-mic-calibration-push-to-talk/index.md
      - 12. Wake-Word Detection: chapters/12-wake-word-detection/index.md
      - 13. Wi-Fi, HTTP, and Connecting to the Agent: chapters/13-wifi-http-agent-link/index.md
      - 14. Streaming Speech, Security, and Network Resilience: chapters/14-streaming-security-resilience/index.md
      - 15. MQTT and Push Alerts: chapters/15-mqtt-push-alerts/index.md
      - 16. Configuring the School Agent and Calendar: chapters/16-school-agent-calendar/index.md
      - 17. Privacy, Safety, and Responsible Listening: chapters/17-privacy-responsible-listening/index.md
      - 18. Testing, Integration, and Capstone Projects: chapters/18-testing-integration-capstones/index.md

  - Synthetic Schools:
      - Overview: schools/index.md
      - Cedar Ridge High School:
          - School Overview: schools/cedar-ridge-high-school/index.md
          - Gale the Griffin: schools/cedar-ridge-high-school/mascot.md
          - Calendar: schools/cedar-ridge-high-school/calendar.md
      - University of Minnesota: schools/u-of-mn/index.md
      - Groves Learning Organization: schools/glo/index.md
      - The Thinking Spot: schools/the-thinking-spot/index.md
      - Two Rivers High School: schools/two-rivers-high-school/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Mascot Test: learning-graph/mascot-test.md
      - Teacher's Guide: learning-graph/teachers-guide/index.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  logo: img/mascot/neutral.png
  favicon: img/favicon.ico
  palette:
    primary: 'amber'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Currency-safe math: inline is \(...\) only, never single $. Run
  # book-installer feature 5 (KaTeX) to add the renderer.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/mascot-image-prompt*.md
  **/cover-prompt.md
  **/character-sheet.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | implemented | instrumented | approved
  # `instrumented` = the sim carries xAPI event handling (main.html loads lrs-sim.js and
  # the code calls LRSSim.create); the add-xapi-events-to-microsim skill's
  # scripts/sync-status.py sets it. Its icon is always the teal "signal" (MDI access-point).
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    implemented: Implemented — the MicroSim works
    instrumented: Instrumented — the MicroSim emits xAPI events; add ?xapi=teaching to the URL to see them
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Open Study Buddy'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
